<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/images/carX2.gif">
    <title>Speed*Limit*</title>
</head>

<body>
    <section class="screen loaderpg">
        <div class="hide log">
            <div class="login flex2">
                <div></div>
                <button class="loginbtn">Start the car</button>
            </div>

        </div>
        <div class="welcome lbg">
            <div class="dark ld flex2">
                <div class="gamenm flex2">
                    <h1>SPEED</h1>
                    <h2 class="flex">
                        <img class="disimg" src="../assets/images/missiles2.png" alt="">
                        <div class="size flex">
                            <span class="flex">*</span>
                        </div>
                        Limit
                        <div class="size flex">
                            <span class="flex">*</span>
                        </div>
                    </h2>
                </div>
                <div class="load">
                    <div class="moveload flex">
                        <img src="../assets/images/burningcar3.png" alt="">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="screen welcomepg">
        <div class="welcome wbg">
            <div class="dark wd flex2">
                <div class="nav flex2 fm">
                    <div class="coin navdiv flex">
                        <div class="img bg1"></div>
                        <div class="text flex">
                            <p>
                            <div>100,890,743,300,000</div>
                            </p>
                        </div>
                    </div>
                    <div class="won navdiv flex">
                        <div class="img bg2"></div>
                        <div class="text flex">
                            <p>Win:
                            <div>0</div>
                            </p>
                        </div>
                    </div>
                    <div class="lost navdiv flex">
                        <div class="img bg3"></div>
                        <div class="text flex">
                            <p>Lose:
                            <div>0</div>
                            </p>
                        </div>
                    </div>

                </div>
                <div class="btns flex2 fm">
                    <button class="startbtn">Quick Match</button>
                    <div class="mode flex">
                        <button class="mode1 calm">Calm</button>
                        <button class="mode2 move">Move</button>
                        <button class="mode3 scared">Scared</button>
                        <button class="mode4 time">Time</button>
                    </div>
                    <button class="garagebtn">Garage </button>
                    <button class="mutebtn">Mute sound</button>
                </div>
            </div>
        </div>
    </section>

    <section class="screen garagepg">
        <div class="garage flex2">
            <div class="slot flex">
                <div class="carinfo flex2">
                    <button class="backbtn">
                        &larr;--
                    </button>
                    <button class="proceedbtn startbtn info">Quick Match &rarr;</button>
                    <button class="change info flex2" id="differ">
                        <p class="forw same">------&rarr;</p>
                        <p class="rever same">&larr;------</p>
                    </button>
                    <button class="flex garagesw info">
                        <p>&larr;------&rarr;</p>
                    </button>
                </div>

                <div class="carimg flex">
                    <div class="car">

                    </div>
                </div>
                <div class="carinfo flex2" id="info">
                    <h2 class="flex"><img src="../assets/images/logo.png" alt="" width="70" height="70"><span
                            class="name"></span></h2>
                    <p>🕡 &rarr; <span class="sp"></span></p>
                    <p>💨 &rarr; <span class="ac"></span></p>
                    <p>☢️ &rarr; <span class="hn"></span></p>
                    <p>🎒 &rarr; <span class="pd"></span></p>
                    <button class="selectbtn"> &larr; <span class="selecttxt"></span> &rarr;</button>
                </div>
            </div>
    </section>

    <section class="screen gamepg">
        <div class="gamebdy flex sky">
            <div class="we"></div>
            <div class="display flex2">
                <div class="topreadings">
                    <button class="backbtn bbtn">
                        &larr;-------
                    </button>
                </div>
                <div class="meter flex2">
                    <div class="com detail">
                        <div class="headering">
                            <div class="car-infosn">
                                <h1 class="nmi">HYPER GT</h1>
                            </div>
                            <div class="status-icons">
                                <div class="status-icon">
                                    <p>👌</p>
                                    <span class="hani">Handling</span>
                                </div>
                                <div class="status-icon">
                                    <p>💨</p>
                                    <span class="acceli">100%</span>
                                </div>
                                <div class="status-icon">
                                    <p>☢️</p>
                                    <span>SPORT</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="com speedo">
                        <div class="gauge" aria-label="Speedometer">
                            <canvas id="speedo" width="800" height="620"></canvas>
                            <div id="labelLayer" class="label-layer"></div>
                            <div class="readout">
                                <div class="value" id="value">0</div>
                                <div class="units">km/h</div>

                            </div>
                        </div>

                    </div>
                    <div class="ms">
                        <div class="com missionbox flex">
                            <div class="mission flex2">
                                <div class="label flex">MIN SPEED</div>
                                <div class="setspeedmin setsp flex">200</div>
                                <p class="unit">KM/H</p>
                            </div>
                            <div class="mission flex2">
                                <div class="label flex">MAX SPEED</div>
                                <div class="setspeedmax setsp flex">400</div>
                                <p class="unit">KM/H</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="earth flex">
                <div class="rock flex rg1">

                    <div class="road dg">

                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- &larr;
                    &rarr;
                    &darr;
                    &uarr;
                    &times; -->

</body>

</html>
