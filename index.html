<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Modern Speedometer (0–1000)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --bg: #0f1220;
      --card: #14182a;
      --ring: #1f2540;
      --accent: #6aa2ff;
      --text: #eaf0ff;
      --text-dim: #9aa3ba;
      --green: #22c55e;
      --orange: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 700px at 50% 20%, #15203f 0%, var(--bg) 55%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    .wrap {
      display: grid;
      gap: 18px;
      place-items: center;
      padding: 24px;
    }
    .gauge {
      width: 360px;
      height: 360px;
      background: linear-gradient(180deg, #0b0e1b, var(--card));
      border-radius: 24px;
      padding: 18px;
      box-shadow:
        0 30px 60px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.04),
        inset 0 -1px 0 rgba(0,0,0,0.4);
      display: grid;
      place-items: center;
      position: relative;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.35));
    }
    .readout {
      position: absolute;
      inset: auto 0 24px 0;
      display: grid;
      place-items: center;
      gap: 6px;
      pointer-events: none;
    }
    .value {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .units {
      color: var(--text-dim);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button.hold {
      appearance: none;
      border: 0;
      background: linear-gradient(180deg, #1a2040, #121633);
      color: #eaf0ff;
      padding: 14px 18px;
      border-radius: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow:
        0 10px 24px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.07),
        inset 0 -1px 0 rgba(0,0,0,0.3);
      transition: transform 0.08s ease, box-shadow 0.15s ease;
      touch-action: none;
      user-select: none;
    }
    button.hold:active,
    button.hold.is-holding {
      transform: translateY(1px) scale(0.995);
      box-shadow:
        0 6px 16px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.06),
        inset 0 -1px 0 rgba(0,0,0,0.4);
    }
    .note {
      color: var(--text-dim);
      font-size: 12px;
      text-align: center;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="gauge" aria-label="Speedometer">
      <canvas id="speedo" width="800" height="800"></canvas>
      <div class="readout">
        <div class="value" id="value">0</div>
        <div class="units">km/h</div>
      </div>
    </div>
    <div class="controls">
      <button class="hold" id="holdBtn" aria-pressed="false" aria-label="Hold to accelerate (Space also works)">
        Hold to Accelerate
      </button>
    </div>
    <div class="note">Tip: Hold the button (or press Space) to speed up. Release to slow down automatically.</div>
  </div>

  <script>
    (() => {
      const MAX_SPEED = 1000;
      const ACCEL_RATE = 20;     // units per second when holding
      const DECEL_RATE = 20;     // units per second when released
      const MINOR_TICK_EVERY = 10; // set to 1 if you truly want a line for every number (very dense)
      const MAJOR_EVERY = 100;

      const canvas = document.getElementById('speedo');
      const ctx = canvas.getContext('2d');
      const valueEl = document.getElementById('value');
      const holdBtn = document.getElementById('holdBtn');

      // HiDPI scaling
      function resizeCanvas() {
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        // Actually, we want logical pixels = CSS pixels. We'll draw using CSS pixel coords.
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        drawStatic();
      }

      // Geometry
      const START_ANGLE = deg2rad(135);  // left/top
      const END_ANGLE   = deg2rad(405);  // right/bottom (135 + 270)
      const SPAN = END_ANGLE - START_ANGLE;

      function deg2rad(d) { return (d * Math.PI) / 180; }
      function valueToAngle(v) { return START_ANGLE + (v / MAX_SPEED) * SPAN; }
      function clamp(n, a, b) { return Math.min(Math.max(n, a), b); }

      // Static layer (ticks, ring, labels) drawn once to an offscreen canvas
      let staticCanvas, sctx;

      function drawStatic() {
        // Prepare sizes based on current canvas size
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        const cx = w / 2;
        const cy = h / 2;

        // Create/resize static canvas
        if (!staticCanvas) {
          staticCanvas = document.createElement('canvas');
          sctx = staticCanvas.getContext('2d');
        }
        staticCanvas.width = w;
        staticCanvas.height = h;

        // Drawing params
        const rOuter = Math.min(w, h) * 0.42;
        const ringWidth = 18;

        sctx.clearRect(0, 0, w, h);

        // Background ring
        sctx.lineCap = 'round';
        sctx.lineWidth = ringWidth;
        sctx.strokeStyle = '#1b2240';
        sctx.beginPath();
        sctx.arc(cx, cy, rOuter, START_ANGLE, END_ANGLE, false);
        sctx.stroke();

        // Color zones (static segments)
        const zones = [
          { from: 0, to: 500, color: '#1ec86e' },
          { from: 500, to: 800, color: '#f7a73d' },
          { from: 800, to: 1000, color: '#ff4d4f' },
        ];
        for (const z of zones) {
          sctx.strokeStyle = z.color + '55'; // translucent
          sctx.beginPath();
          sctx.arc(cx, cy, rOuter, valueToAngle(z.from), valueToAngle(z.to), false);
          sctx.stroke();
        }

        // Tick marks
        const majorLen = 18;
        const minorLen = 8;
        const tickColorMajor = '#eaf0ff';
        const tickColorMinor = '#9aa3ba';
        const minorStep = Math.max(1, MINOR_TICK_EVERY);

        for (let v = 0; v <= MAX_SPEED; v += minorStep) {
          const angle = valueToAngle(v);
          const isMajor = (v % MAJOR_EVERY === 0);

          const len = isMajor ? majorLen : minorLen;
          const lw = isMajor ? 3 : 1.3;
          const color = isMajor ? tickColorMajor : tickColorMinor;

          const x1 = cx + Math.cos(angle) * (rOuter - ringWidth/2 - len);
          const y1 = cy + Math.sin(angle) * (rOuter - ringWidth/2 - len);
          const x2 = cx + Math.cos(angle) * (rOuter - ringWidth/2 + (isMajor ? 4 : 0));
          const y2 = cy + Math.sin(angle) * (rOuter - ringWidth/2 + (isMajor ? 4 : 0));

          sctx.strokeStyle = color;
          sctx.lineWidth = lw;
          sctx.beginPath();
          sctx.moveTo(x1, y1);
          sctx.lineTo(x2, y2);
          sctx.stroke();

          // Labels for majors
          if (isMajor) {
            const labelR = rOuter - ringWidth - 26;
            const lx = cx + Math.cos(angle) * labelR;
            const ly = cy + Math.sin(angle) * labelR;

            sctx.fillStyle = '#dce4ff';
            sctx.font = '600 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial';
            sctx.textAlign = 'center';
            sctx.textBaseline = 'middle';
            sctx.fillText(String(v), lx, ly);
          }
        }

        // Inner face glow
        const faceR = rOuter - ringWidth - 28;
        const g = sctx.createRadialGradient(cx, cy, faceR * 0.2, cx, cy, faceR);
        g.addColorStop(0, 'rgba(106,162,255,0.06)');
        g.addColorStop(1, 'rgba(106,162,255,0.02)');
        sctx.fillStyle = g;
        sctx.beginPath();
        sctx.arc(cx, cy, faceR, 0, Math.PI * 2);
        sctx.fill();

        // Center cap (static base)
        sctx.fillStyle = '#0e1328';
        sctx.beginPath();
        sctx.arc(cx, cy, 18, 0, Math.PI * 2);
        sctx.fill();

        // Save computed geometry for dynamic layer
        geom = { w, h, cx, cy, rOuter, ringWidth, faceR };
      }

      // Shared geometry cache
      let geom = null;

      // Dynamic animation state
      let speed = 0;
      let isHolding = false;
      let lastTime = performance.now();

      function drawDynamic() {
        if (!geom) return;
        const { w, h, cx, cy, rOuter, ringWidth, faceR } = geom;

        // Clear
        ctx.clearRect(0, 0, w, h);

        // Composite: static
        ctx.drawImage(staticCanvas, 0, 0);

        // Progress arc (current speed)
        const angleNow = valueToAngle(speed);
        ctx.lineWidth = ringWidth;
        const progGrad = ctx.createLinearGradient(cx - rOuter, cy, cx + rOuter, cy);
        progGrad.addColorStop(0.0, '#6aa2ff');
        progGrad.addColorStop(1.0, '#92c5ff');
        ctx.strokeStyle = progGrad;
        ctx.shadowColor = 'rgba(146,197,255,0.5)';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(cx, cy, rOuter, START_ANGLE, angleNow, false);
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Needle
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angleNow);

        // needle shape
        const needleLen = rOuter - 24;
        ctx.beginPath();
        ctx.moveTo(-14, 0);
        ctx.lineTo(0, -3.8);
        ctx.lineTo(needleLen, 0);
        ctx.lineTo(0, 3.8);
        ctx.closePath();
        const needleGrad = ctx.createLinearGradient(-14, 0, needleLen, 0);
        needleGrad.addColorStop(0, '#ff6b6b');
        needleGrad.addColorStop(1, '#ff2d55');
        ctx.fillStyle = needleGrad;
        ctx.shadowColor = 'rgba(255,45,85,0.4)';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Center cap (top highlight)
        ctx.beginPath();
        ctx.fillStyle = '#0b0f22';
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#1f274a';
        ctx.stroke();

        ctx.restore();

        // Numeric readout
        valueEl.textContent = Math.round(speed);
      }

      // Animation loop
      function tick(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000); // clamp dt
        lastTime = now;

        if (isHolding) {
          speed = clamp(speed + ACCEL_RATE * dt, 0, MAX_SPEED);
        } else {
          speed = clamp(speed - DECEL_RATE * dt, 0, MAX_SPEED);
        }

        drawDynamic();
        requestAnimationFrame(tick);
      }

      // Input handling
      function setHolding(state) {
        isHolding = state;
        holdBtn.classList.toggle('is-holding', state);
        holdBtn.setAttribute('aria-pressed', String(state));
      }

      // Pointer (mouse/touch/pen)
      holdBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        holdBtn.setPointerCapture(e.pointerId);
        setHolding(true);
      });
      holdBtn.addEventListener('pointerup', (e) => {
        e.preventDefault();
        setHolding(false);
      });
      holdBtn.addEventListener('pointercancel', () => setHolding(false));
      holdBtn.addEventListener('pointerleave', () => setHolding(false));

      // Keyboard (Space/Enter)
      let keyHeld = false;
      window.addEventListener('keydown', (e) => {
        if ((e.code === 'Space' || e.code === 'Enter') && !keyHeld) {
          keyHeld = true;
          setHolding(true);
        }
      });
      window.addEventListener('keyup', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
          keyHeld = false;
          setHolding(false);
        }
      });

      // Resize observer to keep canvas crisp
      const ro = new ResizeObserver(() => resizeCanvas());
      ro.observe(canvas);

      // Kick off
      resizeCanvas();
      drawDynamic();
      requestAnimationFrame((t) => {
        lastTime = t;
        tick(t);
      });
    })();
  </script>
</body>
</html>
